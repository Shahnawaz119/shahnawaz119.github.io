<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a1e"/>
      <stop offset="50%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Glow circles -->
  <circle cx="200" cy="180" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="280" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>

  <!-- Top Telemetry Header -->
  <rect x="40" y="30" width="720" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="65" cy="55" r="6" fill="#10b981"/>
  <text x="85" y="60" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="1">EV POPULATION DATA INTELLIGENCE &amp; ANALYTICS</text>
  <text x="650" y="60" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="13">N = 150K+ EVs</text>

  <!-- Left Card: Metrics -->
  <rect x="40" y="100" width="220" height="150" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12">BEV VS PHEV ADOPTION</text>
  <text x="60" y="170" fill="#38bdf8" font-family="sans-serif" font-size="32" font-weight="bold">78.4%</text>
  <text x="60" y="195" fill="#10b981" font-family="sans-serif" font-size="13">▲ +34.2% YoY Growth</text>
  <path d="M60 220 C 100 215, 140 230, 220 205" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Center Card: Trend Chart -->
  <rect x="280" y="100" width="480" height="210" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="305" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12">ELECTRIC RANGE DISTRIBUTION &amp; MAKE BREAKDOWN</text>
  
  <!-- Wave Graph -->
  <path d="M 310 260 C 360 240, 410 200, 460 210 C 510 220, 560 160, 610 170 C 660 180, 700 130, 730 140 L 730 280 L 310 280 Z" fill="url(#cyanGrad)" opacity="0.15"/>
  <path d="M 310 260 C 360 240, 410 200, 460 210 C 510 220, 560 160, 610 170 C 660 180, 700 130, 730 140" fill="none" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <circle cx="460" cy="210" r="4" fill="#38bdf8"/>
  <circle cx="610" cy="170" r="4" fill="#a855f7"/>
  <circle cx="730" cy="140" r="5" fill="#ec4899"/>

  <!-- Bottom Section: Tech Badges & EV Icon Graphic -->
  <rect x="40" y="270" width="220" height="150" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="305" fill="#94a3b8" font-family="sans-serif" font-size="12">CAFV ELIGIBILITY</text>
  <text x="60" y="345" fill="#a855f7" font-family="sans-serif" font-size="30" font-weight="bold">92.8%</text>
  <text x="60" y="375" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">Clean Fuel Compliant</text>
  <rect x="60" y="390" width="180" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="60" y="390" width="165" height="6" rx="3" fill="url(#purpleGrad)"/>

  <!-- Right Bottom Tech Highlights -->
  <rect x="280" y="330" width="480" height="90" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="305" y="360" fill="#94a3b8" font-family="sans-serif" font-size="12">CORE STACK &amp; METHODOLOGY</text>
  <g transform="translate(305, 375)">
    <rect x="0" y="0" width="85" height="28" rx="6" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.3)"/>
    <text x="14" y="18" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">Pandas</text>

    <rect x="95" y="0" width="85" height="28" rx="6" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.3)"/>
    <text x="112" y="18" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="600">NumPy</text>

    <rect x="190" y="0" width="95" height="28" rx="6" fill="rgba(236,72,153,0.1)" stroke="rgba(236,72,153,0.3)"/>
    <text x="202" y="18" fill="#ec4899" font-family="sans-serif" font-size="12" font-weight="600">Matplotlib</text>

    <rect x="295" y="0" width="85" height="28" rx="6" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)"/>
    <text x="312" y="18" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">Seaborn</text>

    <rect x="390" y="0" width="70" height="28" rx="6" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)"/>
    <text x="408" y="18" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="600">EDA</text>
  </g>
</svg>
