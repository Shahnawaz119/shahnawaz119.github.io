<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040817"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg2)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Ambient Light Blobs -->
  <circle cx="240" cy="190" r="150" fill="#10b981" opacity="0.12" filter="url(#glow2)"/>
  <circle cx="640" cy="240" r="150" fill="#06b6d4" opacity="0.12" filter="url(#glow2)"/>

  <!-- Top Status Bar -->
  <rect x="40" y="30" width="720" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="65" cy="55" r="6" fill="#06b6d4"/>
  <text x="85" y="60" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="1">UIDAI AADHAAR ENROLLMENT INTELLIGENCE</text>
  <text x="610" y="60" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">STATUS: ANOMALY GUARD ACTIVE</text>

  <!-- Left Anomaly Detection Telemetry -->
  <rect x="40" y="100" width="230" height="200" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12">ANOMALY DETECTION MODEL</text>
  <text x="60" y="165" fill="#10b981" font-family="sans-serif" font-size="24" font-weight="bold">Isolation Forest</text>
  <text x="60" y="190" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">Contamination: 0.035</text>
  
  <rect x="60" y="210" width="190" height="35" rx="6" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.2)"/>
  <text x="75" y="232" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">✔ 99.4% Precision Verified</text>

  <rect x="60" y="255" width="190" height="25" rx="4" fill="rgba(245,158,11,0.08)"/>
  <text x="75" y="272" fill="#f59e0b" font-family="sans-serif" font-size="11">Detecting demographic skew</text>

  <!-- Center Scatter Plot: Normal vs Anomaly Data Points -->
  <rect x="290" y="100" width="470" height="200" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="315" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12">LATENT SPACE ENROLLMENT SCATTER DISTRIBUTION</text>

  <!-- Normal Points -->
  <g fill="#06b6d4" opacity="0.65">
    <circle cx="340" cy="180" r="4"/><circle cx="355" cy="195" r="4"/><circle cx="370" cy="175" r="4"/>
    <circle cx="380" cy="220" r="4"/><circle cx="395" cy="210" r="4"/><circle cx="410" cy="190" r="4"/>
    <circle cx="430" cy="230" r="4"/><circle cx="450" cy="205" r="4"/><circle cx="465" cy="195" r="4"/>
    <circle cx="485" cy="225" r="4"/><circle cx="505" cy="215" r="4"/><circle cx="520" cy="240" r="4"/>
    <circle cx="540" cy="210" r="4"/><circle cx="560" cy="190" r="4"/><circle cx="580" cy="200" r="4"/>
    <circle cx="600" cy="225" r="4"/><circle cx="625" cy="210" r="4"/><circle cx="650" cy="235" r="4"/>
    <circle cx="670" cy="220" r="4"/><circle cx="690" cy="205" r="4"/><circle cx="710" cy="230" r="4"/>
    <circle cx="360" cy="235" r="4"/><circle cx="420" cy="250" r="4"/><circle cx="480" cy="260" r="4"/>
    <circle cx="550" cy="250" r="4"/><circle cx="630" cy="255" r="4"/>
  </g>

  <!-- Anomaly Points (Outliers in Red/Amber) -->
  <g fill="#ef4444" filter="url(#glow2)">
    <circle cx="330" cy="270" r="6"/>
    <circle cx="440" cy="150" r="6"/>
    <circle cx="610" cy="140" r="6"/>
    <circle cx="720" cy="160" r="6"/>
  </g>
  <text x="732" y="164" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11">Outlier #1</text>
  <text x="622" y="144" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11">Outlier #2</text>

  <!-- Bottom Panel -->
  <rect x="40" y="320" width="720" height="100" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="65" y="355" fill="#94a3b8" font-family="sans-serif" font-size="12">PIPELINE ARCHITECTURE</text>
  <g transform="translate(65, 370)">
    <rect x="0" y="0" width="95" height="30" rx="6" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)"/>
    <text x="18" y="19" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">Python</text>

    <rect x="110" y="0" width="135" height="30" rx="6" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.3)"/>
    <text x="18" y="19" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="600">Isolation Forest</text>

    <rect x="260" y="0" width="105" height="30" rx="6" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)"/>
    <text x="18" y="19" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="600">Streamlit</text>

    <rect x="380" y="0" width="120" height="30" rx="6" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.3)"/>
    <text x="18" y="19" fill="#8b5cf6" font-family="sans-serif" font-size="12" font-weight="600">Scikit-learn</text>

    <rect x="515" y="0" width="150" height="30" rx="6" fill="rgba(236,72,153,0.1)" stroke="rgba(236,72,153,0.3)"/>
    <text x="18" y="19" fill="#ec4899" font-family="sans-serif" font-size="12" font-weight="600">UIDAI Hackathon</text>
  </g>
</svg>
